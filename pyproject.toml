[project]
name = "bookdna-worker"
version = "0.1.0"
description = "BookDNA Cloudflare Python Worker"
requires-python = ">=3.13"
dependencies = [
  "duckdb>=1.3,<2",
  "pymarc>=5.2,<6",
]

[project.scripts]
bookdna-catalog = "catalog_pipeline.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["tools"]
